<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dreeve Heatmap Plugin Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <h1>dreeve Heatmap Plugin Settings</h1>
      <p class="hint">
        Requires dreeve v5.2.0+. Example endpoint:
        <code>http://your-host:8095/api/fragment/data/heatmap/routes</code>
      </p>

      <label for="endpoint">Routes endpoint URL</label>
      <input id="endpoint" type="url" />
      <label for="lineColor">Route color</label>
      <input id="lineColor" type="color" value="#ff4500" />

      <label for="lineOpacity">Route opacity (0.05 - 1)</label>
      <input id="lineOpacity" type="number" min="0.05" max="1" step="0.05" value="0.35" />

      <label for="lineWidth">Route width (1 - 12)</label>
      <input id="lineWidth" type="number" min="1" max="12" step="0.5" value="2" />

      <div class="filter-header">
        <label>Sport categories filter</label>
        <div class="filter-actions">
          <button id="sportsSelectAll" type="button" class="mini-btn">Select all</button>
          <button id="sportsClearAll" type="button" class="mini-btn">Clear</button>
        </div>
      </div>
      <div id="sportTypesGroup" class="checkbox-group"></div>
      <button id="save" type="button">Save settings</button>
      <p id="status"></p>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
