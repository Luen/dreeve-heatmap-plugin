<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dreeve Heatmap Plugin Options</title>
        <link rel="stylesheet" href="options.css" />
    </head>
    <body>
        <main class="container">
            <h1>Dreeve Heatmap Plugin Settings</h1>
            <p class="hint">
                Routes require Dreeve v5.3.0+. Explorer tiles require v5.6.0+.
                Changes save automatically. Example endpoint:
                <code>https://localhost:8000/api/internal/heatmap/routes</code>
            </p>

            <label for="endpoint">Routes endpoint URL</label>
            <input id="endpoint" type="url" />
            <label for="lineColor">Route color</label>
            <input id="lineColor" type="color" value="#ff4500" />

            <label for="lineOpacity">Route opacity (0.05 - 1)</label>
            <input
                id="lineOpacity"
                type="number"
                min="0.05"
                max="1"
                step="0.05"
                value="0.35"
            />

            <label for="lineWidth">Route width (1 - 12)</label>
            <input
                id="lineWidth"
                type="number"
                min="1"
                max="12"
                step="0.5"
                value="2"
            />

            <div class="filter-header">
                <label>Sport categories filter</label>
                <div class="filter-actions">
                    <button id="sportsSelectAll" type="button" class="mini-btn">
                        Select all
                    </button>
                    <button id="sportsClearAll" type="button" class="mini-btn">
                        Clear
                    </button>
                </div>
            </div>
            <div id="sportTypesGroup" class="checkbox-group"></div>
            <div class="filter-header">
                <label>Layers</label>
            </div>
            <div class="checkbox-group layer-toggles">
                <label class="checkbox-item" for="showRoutes">
                    <input id="showRoutes" type="checkbox" checked />
                    <span>Show routes</span>
                </label>
                <label class="checkbox-item" for="showTiles">
                    <input id="showTiles" type="checkbox" checked />
                    <span>Show tiles</span>
                </label>
            </div>
            <p class="hint">
                Tiles apply on MapLibre (gpx.studio) and Mapbox GL JS
                (Wanderstories) only — not OpenStreetMap iD.
            </p>
            <p id="status"></p>
        </main>

        <script type="module" src="options.js"></script>
    </body>
</html>
